<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Boston Wyatt about web design and development projects.">
    <title>Boston Wyatt | Contact</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="contact-page">
    <header class="site-header">
        <div class="shell"><h1>Contact me</h1><p>I would be happy to hear about your project or idea.</p></div>
    </header>
    <main class="contact-content shell">
        <p><a href="../index.html">Back to portfolio</a> or <a href="resume.html">view my resume</a>.</p>
        <form class="contact-form" action="#" method="post">
            <div class="form-field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
            <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="form-field"><label for="message">Message</label><textarea id="message" name="message" rows="6" placeholder="Tell me a little about your project." required></textarea></div>
            <label class="checkbox-field" for="updates"><input id="updates" name="updates" type="checkbox"> Send me occasional portfolio updates</label>
            <button type="submit">Send message</button>
        </form>
    </main>
</body>
</html>
